<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
        <title>Giant Clock</title>
        <meta charset="utf-8">
    </head>
    <body>
        <p id="time">time</p>
        <p id="date">date</p>
        <button id="setting">⚙</button>
        <div id="settings">
            <h2>Background Image</h2>
            <button id="stars" class="S">Stars</button>
            <button id="sea" class="S">Sea</button>
            <h2>Font of Clock</h2>
            <button id="MontserratC" class="S">Montserrat</button>
            <button id="OswaldC" class="S">Oswald</button>
            <button id="PixelifyC" class="S">Pixelify Sans</button>
            <h2>Font of Date</h2>
            <button id="montT" class="S">Montserrat</button>
            <button id="oswaldT" class="S">Oswald</button>
            <button id="pixelT" class="S">Pixelify Sans</button>
        </div>
    </body>
    <style>
        #time{
            font-size: 700%;
            text-align: center;
            margin-top: 10%;
            color: white;
            text-shadow: 0px 0px 15px rgb(73, 73, 73);
            transition: 0.5s ease;
            padding:2px;
            font-family: Montserrat;
            margin-bottom: 1px;
        }
        #time:hover{
            text-shadow: 30%, white;
            text-shadow: 0px 0px 15px rgb(6, 205, 255);
            font-size: 750%;
            
        }
        #date{
            color: white;
            text-align: center;
            font-size: 200%;
            font-family: Oswald;
            text-shadow: 0px 0px 5px rgb(10,10,10);
        }
        #seconds{
            font-size: 80%;
            margin-left:3%;
            color: rgb(200,200,200);
        }
        body{
            height:100%;
            background-image: url("stars.png");
            background-size:cover;
            background-position: center;
            background-repeat:no-repeat;
            min-height: 100vh;
            overflow: hidden;
        }
        #setting{
            background-color: rgba(0,0,0,0.2);
            border-color: white;
            border-radius: 5px;
            color: white;

        }
        #settings{
            background-color: rgba(0,0,0,0.4);
            color: rgb(240,240,240);
            padding: 2%;
            border-radius: 10px;
            transition: 0.3s ease;
            position: fixed;

        }
        .hidden{
            display: none;
        }
        .S, h2{
            font-weight:500;
            outline-width: 0;
            font-family: Oswald;
        }
    </style>
    
    <script>
        function updateClock() {
            const now = new Date();

            let hours = String(now.getHours()).padStart(2, "0");
            let minutes = String(now.getMinutes()).padStart(2, "0");
            let seconds = String(now.getSeconds()).padStart(2, "0");

            document.getElementById("time").innerHTML =
                `${hours}:${minutes}<span id="seconds">${seconds}</span>`;

            document.getElementById("date").textContent =
                now.toDateString();
        }

        document.getElementById('setting').addEventListener("click", function(){
            document.getElementById("settings").classList.toggle("hidden");
        });

        document.getElementById('stars').addEventListener("click",function(){
            document.body.style.backgroundImage="url('stars.png')";
        });

        document.getElementById('sea').addEventListener("click",function(){
            document.body.style.backgroundImage="url('sea.jpg')";
        });

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</html>
