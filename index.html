<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
        <title>Clock</title>
        <meta charset="utf-8">
    </head>
    <body>
        <p id="time">time</p>
        <p id="date">date</p>
        <button>⚙</button>
        <div id="settings">
            <h2>Background Image</h2>
            <buttton id="stars">Stars</buttton>
        </div>
    </body>
    <style>
        #time{
            font-size: 700%;
            text-align: center;
            margin-top: 10%;
            color: white;
            text-shadow: none;
            transition: 0.5s ease;
            background-color: rgba(0,0,0,0.2);
            padding:2px;
            font-family: Montserrat;
            
        }
        #time:hover{
            text-shadow: 30%, white;
            text-shadow: white;
            font-size: 750%;
            
        }
        #date{
            color: white;
            text-align: center;
            font-size: 200%;
        }
        #seconds{
            font-size: 80%;
            margin-left:3%;
            color: rgb(200,200,200);
        }
        body{
            background-image: url("stars.png");
            background-size:auto;
            background-position: center;
            background-repeat:repeat;
        }
        buttons{
            position: fixed;
            transform: rotateX('angle');
            background-color: black;
            border-color: white;
            border-radius: 5px;

        }
    </style>
    
    <script>
        function updateClock() {
            const now = new Date();

            let hours = String(now.getHours()).padStart(2, "0");
            let minutes = String(now.getMinutes()).padStart(2, "0");
            let seconds = String(now.getSeconds()).padStart(2, "0");

            document.getElementById("time").innerHTML =
                `${hours}:${minutes}<span id="seconds">${seconds}</span>`;

            document.getElementById("date").textContent =
                now.toDateString();
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</html>
